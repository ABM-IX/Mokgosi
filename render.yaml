# Secrets never get a `value:` here. Keys marked `sync: false` are set in the Render dashboard.
# scripts/check_no_secrets.py (part of the backend test suite) fails if a secret is written inline.
services:
  - type: web
    name: mokgosi-backend
    env: python
    rootDir: mokgosi-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ED25519_PRIVATE_KEY_SEED
        sync: false
      - key: ED25519_PUBLIC_KEYRING
        sync: false
      - key: DEVICE_API_KEYS
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: NOTIFIER_PROVIDER
        value: "console"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_PER_IP_PER_MINUTE
        value: "120"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://mokgosi-dashboard.onrender.com"
      - key: ESCALATION_SECONDS
        value: "30"
      - key: EVIDENCE_STORAGE_BUCKET
        value: "evidence-media"

  - type: static
    name: mokgosi-dashboard
    rootDir: mokgosi-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        value: https://mokgosi-backend.onrender.com
      - key: VITE_DEMO_MODE
        value: "false"
